name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: CLI smoke test (Windows only)
        if: runner.os == 'Windows'
        run: python -m drvwatch --no-color --json out.json

      - name: Upload report
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: drvwatch-report-${{ matrix.python-version }}
          path: out.json
